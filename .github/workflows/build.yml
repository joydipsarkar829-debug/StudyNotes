name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --network-timeout 120000

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Expo prebuild
        run: npx expo prebuild --platform android --clean

      - name: Patch build config
        run: |
          sed -i 's/newArchEnabled=true/newArchEnabled=false/' android/gradle.properties
          python3 - <<'PYEOF'
          import re
          p = 'android/app/build.gradle'
          s = open(p).read()
          s = s.replace(
              "def enableShrinkResources = findProperty('android.enableShrinkResourcesInReleaseBuilds') ?: 'false'",
              "def enableShrinkResources = true"
          )
          s = s.replace(
              "def enableMinifyInReleaseBuilds = (findProperty('android.enableMinifyInReleaseBuilds') ?: false).toBoolean()",
              "def enableMinifyInReleaseBuilds = true"
          )
          open(p, 'w').write(s)
          print('patched:', 'enableMinifyInReleaseBuilds = true' in s, '| shrink:', "def enableShrinkResources = true" in s)
          PYEOF

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build APK (Release)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: study-notes-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
